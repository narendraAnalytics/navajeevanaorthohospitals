services:
  - name: orthoai-backend
    type: web
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/seed_knowledge_base.py && python scripts/seed_doctors.py && python scripts/generate_slots.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CHROMA_MODE
        value: local
      - key: ALLOWED_ORIGIN
        value: https://navajeevanaorthohospitals.vercel.app
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: NEON_DB_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        sync: false
